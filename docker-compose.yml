name: calculator

services:
  calculator:
    image: ${DOCKER_IMAGE:-calculator-devops}:${IMAGE_TAG:-latest}
    build: .
    environment:
      SERVER_PORT: "8080"
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"
    expose:
      - "8080"
    deploy:
      replicas: 2            # two replicas behind the proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"UP\"'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - calc-net

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${PROXY_PORT:-8081}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/actuator/health | grep -q '\"UP\"'"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - calc-net

networks:
  calc-net:
    driver: bridge
